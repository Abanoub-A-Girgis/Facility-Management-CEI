<section class="page">
  <div class="page-header">
    <h1>Upload IFC Model</h1>
    <p>Upload an IFC file to process floors and generate browser-viewable model data.</p>
  </div>

  <div class="upload-panel">
    <label for="ifcFile">IFC file</label>
    <input id="ifcFile" type="file" accept=".ifc" (change)="onFileSelected($event)" />

    <div class="file-summary" *ngIf="selectedFile">
      <strong>{{ selectedFile.name }}</strong>
      <span>{{ selectedFile.size / 1024 / 1024 | number: '1.1-1' }} MB</span>
    </div>

    <button type="button" (click)="upload()" [disabled]="loading || !selectedFile">
      {{ loading ? 'Uploading...' : 'Upload and Process' }}
    </button>

    <div class="progress" *ngIf="loading">
      <div [style.width.%]="progress"></div>
    </div>

    <p class="status success" *ngIf="success">{{ success }}</p>
    <p class="status error" *ngIf="error">{{ error }}</p>
  </div>
</section>
