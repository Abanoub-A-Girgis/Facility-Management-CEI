<section class="panel">
  <h2>{{ 'Indicators.Title' | t }}</h2>

  <label class="toggle">
    <input type="checkbox" [checked]="highlightEnabled" (change)="setHighlight($event)" />
    <span>{{ 'Indicators.Highlight' | t }}</span>
  </label>

  <label class="toggle">
    <input type="checkbox" [checked]="flashingEnabled" (change)="setFlashing($event)" />
    <span>{{ 'Indicators.Flash' | t }}</span>
  </label>

  <div class="legend">
    <span><i class="severe"></i> {{ 'Severity.Severe' | t }}</span>
    <span><i class="high"></i> {{ 'Severity.High' | t }}</span>
    <span><i class="medium"></i> {{ 'Severity.Medium' | t }}</span>
    <span><i class="low"></i> {{ 'Severity.Low' | t }}</span>
  </div>
</section>
